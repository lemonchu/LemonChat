name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Terminal test dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r tests/requirements.txt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 '-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL'
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix package
      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item 'C:/Program Files/OpenSSL/bin/libcrypto-3-x64.dll' package/bin/
          Copy-Item 'C:/Program Files/OpenSSL/bin/libssl-3-x64.dll' package/bin/
          Copy-Item README.md, LICENSE package/
          Copy-Item docs/third-party package/third-party -Recurse
      - name: Package Unix documentation
        if: runner.os != 'Windows'
        run: cp -R README.md LICENSE docs/third-party package/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lemonchat-${{ matrix.os }}
          path: package/
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: python -m pip install -r tests/requirements.txt
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined -no-pie'
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
